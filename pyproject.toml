[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainsignal"
version = "0.1.0"
description = "Batch crypto market + on-chain anomaly detection (CoinGecko, Etherscan, ClickHouse, PySpark)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs running services (ClickHouse, Java for Spark)",
]
