# Connection comes from the same environment variables as the Python code (.env).
chainsignal:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'chainsignal') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'chainsignal') }}"
      schema: "{{ env_var('CLICKHOUSE_DB', 'chainsignal') }}"
      secure: false
      threads: 4
